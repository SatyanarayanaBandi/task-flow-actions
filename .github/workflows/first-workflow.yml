name: First GitHub Actions Workflow

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  first-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Print Hello
        run: echo "Hello from GitHub Actions"

      - name: Show Current Directory
        run: pwd

      - name: List Files
        run: ls -la

      - name: Show Runner Information
        run: |
          echo "Operating System:"
          uname -a
          echo "Runner Name:"
          echo "$RUNNER_NAME"
          echo "Runner OS:"
          echo "$RUNNER_OS"

      - name: Multiple Commands
        run: |
          echo "Command 1"
          echo "Command 2"
          echo "Command 3"
          pwd
          ls -la