name: GitHub Actions Conditions

"on":
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  condition-job:
    runs-on: ubuntu-latest

    steps:
      - name: First Step
        run: echo "First step succeeded"

      - name: Intentional Failure
        run: |
          echo "This step will fail"
          exit 1

      - name: Normal Next Step
        run: echo "This step will be skipped"

      - name: Failure Handler
        if: failure()
        run: echo "A previous step failed, so this step is running"