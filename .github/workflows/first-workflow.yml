name: GitHub Actions Job Outputs

"on":
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  first-job:
    runs-on: ubuntu-latest

    outputs:
      app-version: ${{ steps.version.outputs.value }}

    steps:
      - name: Create App Version
        id: version
        run: echo "value=1.0.0" >> "$GITHUB_OUTPUT"

      - name: Show Created Version
        run: echo "Created version is ${{ steps.version.outputs.value }}"

  second-job:
    needs: first-job
    runs-on: ubuntu-latest

    steps:
      - name: Receive App Version
        run: echo "Received version is ${{ needs.first-job.outputs.app-version }}"