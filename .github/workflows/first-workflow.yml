name: GitHub Actions Always Condition

"on":
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  always-job:
    runs-on: ubuntu-latest

    steps:
      - name: First Step
        run: echo "First step succeeded"

      - name: Intentional Failure
        run: |
          echo "This step will fail"
          exit 1

      - name: Normal Step
        run: echo "This step will be skipped"

      - name: Always Run Step
        if: always()
        run: echo "This step runs even after failure"